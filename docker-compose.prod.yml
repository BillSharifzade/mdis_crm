# Прод-оверрайд. Применяется поверх docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Запускается на shared-хосте, где крутятся другие проекты. Поэтому:
#   - Postgres биндится только на loopback (внутрь хоста), извне не доступен.
#   - Пароль БД и секреты подтягиваются из .env (никаких дефолтов).
#   - Frontend пересобирается с правильным публичным API URL (см. PUBLIC_API_BASE_URL).
#
# Обязательные переменные в .env:
#   POSTGRES_PASSWORD     — пароль для роли crm_user
#   JWT_SECRET            — секрет для подписи JWT
#   WEBHOOK_SECRET        — секрет для X-Webhook-Secret (телефония)
#   TELEGRAM_BOT_TOKEN    — токен бота
#   PUBLIC_API_BASE_URL   — публичный URL API, виден из браузеров (например http://10.10.10.25:8082/api/v1)

services:
  db:
    environment:
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in prod}"
      POSTGRES_DB: mdis_crm
    # !override заменяет base-список портов целиком, чтобы не было двойного байнда (0.0.0.0 + 127.0.0.1).
    ports: !override
      - "127.0.0.1:5434:5432"

  backend:
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://crm_user:${POSTGRES_PASSWORD}@db:5432/mdis_crm?sslmode=disable"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required in prod}"
      WEBHOOK_SECRET: "${WEBHOOK_SECRET:?WEBHOOK_SECRET is required in prod}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required in prod}"
      APP_ENV: "production"

  frontend:
    build:
      context: ./crm-frontend
      args:
        VITE_API_BASE_URL: "${PUBLIC_API_BASE_URL:?PUBLIC_API_BASE_URL is required in prod}"
        VITE_USE_API: "true"
