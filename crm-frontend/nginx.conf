server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Кэш статики: ассеты содержат хэш в имени — кэшируем надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html НЕ кэшируем. Иначе после деплоя браузеры держат старый бандл
    # (старый хэш ассетов / старый API URL) — это и вызывало "разные БД" у юзеров.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # SPA fallback — любые роуты возвращают index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Базовые health
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
