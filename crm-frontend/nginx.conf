server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Кэш статики
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — любые роуты возвращают index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Базовые health
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
